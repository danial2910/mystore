<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0b2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e0e7ff;
        }
        body::before {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
            top: -200px; right: -200px;
            animation: pulse 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulse { 0%,100%{transform:scale(1);opacity:.3} 50%{transform:scale(1.2);opacity:.5} }
        .card-glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
        }
        .profile-avatar {
            width: 100px; height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid rgba(129,140,248,0.5);
        }
        .avatar-placeholder {
            width: 100px; height: 100px;
            border-radius: 50%;
            background: rgba(99,102,241,0.2);
            border: 3px solid rgba(129,140,248,0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.5rem; color: #818cf8;
        }
        .info-row { padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.07); }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #94a3b8; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .info-value { color: #e0e7ff; font-weight: 500; }
        .info-missing { color: #64748b; font-style: italic; }
        .btn-primary-grad {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none; color: white; border-radius: 10px; padding: 10px 20px;
            font-weight: 600; text-decoration: none; display: inline-block;
            transition: all 0.2s;
        }
        .btn-primary-grad:hover { opacity: 0.9; transform: translateY(-1px); color: white; }
        .nav-pill {
            color: #a5b4fc; text-decoration: none; padding: 8px 16px;
            border-radius: 8px; background: rgba(129,140,248,0.1);
            border: 1px solid rgba(129,140,248,0.2); transition: all 0.2s;
            display: inline-block;
        }
        .nav-pill:hover { background: rgba(129,140,248,0.2); color: #c7d2fe; }
        .badge-status {
            padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
        }
        .badge-complete { background: rgba(16,185,129,0.2); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.3); }
        .badge-incomplete { background: rgba(245,158,11,0.2); color: #fcd34d; border: 1px solid rgba(245,158,11,0.3); }
    </style>
</head>
<body>
<div class="container py-5" style="max-width:700px; position:relative; z-index:1;">

    <h1 class="mb-4 text-center fw-bold" style="background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
        Your Account
    </h1>

    <!-- Flash messages -->
    <div th:if="${error}" class="alert alert-danger rounded-3 mb-3" th:text="${error}"></div>
    <div th:if="${success}" class="alert alert-success rounded-3 mb-3" th:text="${success}"></div>

    <!-- Profile card -->
    <div class="card-glass p-4 mb-4">
        <div class="d-flex align-items-center gap-4 mb-4">
            <div>
                <img th:if="${user.profilePicture}"
                     th:src="@{'/images/profiles/' + ${user.profilePicture}}"
                     alt="Profile" class="profile-avatar">
                <div th:unless="${user.profilePicture}" class="avatar-placeholder">
                    <i class="fas fa-user"></i>
                </div>
            </div>
            <div>
                <h4 class="mb-1" th:text="${user.fullName ?: user.username}">Username</h4>
                <div class="text-muted small" th:text="${'@' + user.username}">@username</div>
                <span class="badge-status badge-complete mt-1" th:if="${profileComplete}">
                    <i class="fas fa-check-circle me-1"></i>Profile Complete
                </span>
                <span class="badge-status badge-incomplete mt-1" th:unless="${profileComplete}">
                    <i class="fas fa-exclamation-circle me-1"></i>Profile Incomplete — required to book items
                </span>
            </div>
        </div>

        <div class="info-row">
            <div class="info-label">Email</div>
            <div class="info-value" th:text="${user.email}">email@example.com</div>
        </div>
        <div class="info-row">
            <div class="info-label">Full Name</div>
            <div th:if="${user.fullName}" class="info-value" th:text="${user.fullName}"></div>
            <div th:unless="${user.fullName}" class="info-missing">Not set</div>
        </div>
        <div class="info-row">
            <div class="info-label">IC Number</div>
            <div th:if="${user.icNumber}" class="info-value" th:text="${user.icNumber}"></div>
            <div th:unless="${user.icNumber}" class="info-missing">Not set</div>
        </div>
        <div class="info-row">
            <div class="info-label">Phone Number</div>
            <div th:if="${user.phoneNumber}" class="info-value" th:text="${user.phoneNumber}"></div>
            <div th:unless="${user.phoneNumber}" class="info-missing">Not set</div>
        </div>
        <div class="info-row">
            <div class="info-label">Address</div>
            <div th:if="${user.address}" class="info-value" th:text="${user.address}"></div>
            <div th:unless="${user.address}" class="info-missing">Not set</div>
        </div>

        <div class="mt-4">
            <a th:href="@{/account/edit}" class="btn-primary-grad">
                <i class="fas fa-pen me-2"></i>Edit Profile
            </a>
        </div>
    </div>

    <!-- Navigation -->
    <div class="card-glass p-4 mb-4">
        <div class="d-flex flex-wrap gap-2">
            <a class="nav-pill" th:href="@{/items}"><i class="fas fa-boxes me-1"></i>Inventory</a>
            <a class="nav-pill" th:href="@{/items/my}"><i class="fas fa-list me-1"></i>My Items</a>
            <a class="nav-pill" th:href="@{/billing/my}"><i class="fas fa-file-invoice-dollar me-1"></i>My Bills</a>
            <a th:if="${isAdmin}" class="nav-pill" th:href="@{/admin/items}"><i class="fas fa-user-shield me-1"></i>Admin</a>
        </div>
    </div>

    <!-- Logout -->
    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="btn w-100 fw-semibold py-3"
                style="background:linear-gradient(135deg,#6366f1,#8b5cf6);color:white;border-radius:12px;border:none;">
            <i class="fas fa-sign-out-alt me-2"></i>Logout
        </button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
