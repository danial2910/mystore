<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danial Store - Edit Item</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8B5CF6;
            --primary-dark: #7C3AED;
            --secondary: #06B6D4;
            --dark: #0F172A;
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --shadow-card: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            --gradient-primary: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #8B5CF6 100%);
            --gradient-mesh:
                radial-gradient(at 40% 20%, #8B5CF6 0px, transparent 50%),
                radial-gradient(at 80% 0%, #06B6D4 0px, transparent 50%),
                radial-gradient(at 0% 50%, #F59E0B 0px, transparent 50%),
                radial-gradient(at 80% 50%, #EF4444 0px, transparent 50%),
                radial-gradient(at 0% 100%, #10B981 0px, transparent 50%);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            min-height: 100vh;
            position: relative;
        }

        .mesh-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--gradient-mesh);
            opacity: 0.8;
            z-index: -1;
        }

        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .form-wrapper {
            width: 100%;
            max-width: 560px;
        }

        .form-card {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-card);
        }

        .page-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .page-title {
            color: var(--text-primary);
            font-weight: 800;
            font-size: 2.25rem;
            background: linear-gradient(135deg, #F8FAFC 0%, #8B5CF6 50%, #06B6D4 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .page-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            font-weight: 500;
        }

        .title-icon {
            width: 60px;
            height: 60px;
            background: var(--gradient-primary);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }

        .title-icon i {
            font-size: 1.5rem;
            color: white;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .form-label i {
            color: var(--primary);
        }

        .form-control, .form-select {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(148, 163, 184, 0.3);
            border-radius: 16px;
            color: var(--dark);
            font-size: 1rem;
            font-weight: 500;
            padding: 1rem 1.25rem;
        }

        .form-control:focus, .form-select:focus {
            background: #fff;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .file-upload-area {
            position: relative;
            border: 2px dashed rgba(139, 92, 246, 0.4);
            border-radius: 20px;
            background: rgba(30, 41, 59, 0.4);
            padding: 2rem;
            text-align: center;
            cursor: pointer;
        }

        .file-upload-icon {
            width: 64px;
            height: 64px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }

        .file-upload-icon i {
            font-size: 1.75rem;
            color: white;
        }

        .file-upload-text {
            color: var(--text-primary);
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .file-upload-hint {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }

        .file-input {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        .btn {
            flex: 1;
            padding: 1rem 2rem;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 16px;
            border: none;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 8px 25px rgba(139, 92, 246, 0.4);
        }

        .btn-primary:hover {
            color: white;
            filter: brightness(1.1);
        }

        .btn-secondary {
            background: rgba(30, 41, 59, 0.8);
            color: var(--text-primary);
            border: 1px solid rgba(148, 163, 184, 0.2);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            background: rgba(30, 41, 59, 0.95);
        }

        .error-message {
            color: #EF4444;
            font-size: 0.875rem;
            font-weight: 500;
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            .form-card {
                padding: 2rem 1.5rem;
                border-radius: 24px;
            }

            .page-title {
                font-size: 1.85rem;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="mesh-background"></div>

    <div class="main-container">
        <div class="form-wrapper">
            <div class="form-card">
                <div class="page-header">
                    <div class="title-icon"><i class="fas fa-edit"></i></div>
                    <h1 class="page-title">Edit Item</h1>
                    <p class="page-subtitle">Update your pending item details</p>
                </div>

                <form th:action="@{'/items/edit/' + ${id}}" th:object="${itemDTO}" method="post" enctype="multipart/form-data">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    <div class="form-group">
                        <label class="form-label" for="name"><i class="fas fa-box"></i>Item Name</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder="Enter item name" required>
                        <div th:if="${#fields.hasErrors('name')}" class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span th:errors="*{name}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="brand"><i class="fas fa-trademark"></i>Brand</label>
                        <input type="text" class="form-control" id="brand" th:field="*{brand}" placeholder="Enter brand" required>
                        <div th:if="${#fields.hasErrors('brand')}" class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span th:errors="*{brand}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="category"><i class="fas fa-tags"></i>Category</label>
                        <select class="form-select" id="category" th:field="*{category}" required>
                            <option value="" disabled>Select category</option>
                            <option value="electronics">Electronics</option>
                            <option value="fashion">Fashion &amp; Apparel</option>
                            <option value="home">Home &amp; Garden</option>
                            <option value="books">Books &amp; Media</option>
                            <option value="sports">Sports &amp; Recreation</option>
                            <option value="beauty">Beauty &amp; Personal Care</option>
                            <option value="automotive">Automotive</option>
                            <option value="toys">Toys &amp; Games</option>
                            <option value="health">Health &amp; Wellness</option>
                            <option value="office">Office Supplies</option>
                        </select>
                        <div th:if="${#fields.hasErrors('category')}" class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span th:errors="*{category}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="quantity"><i class="fas fa-cubes"></i>Quantity</label>
                        <input type="number" min="0" class="form-control" id="quantity" th:field="*{quantity}" placeholder="0" required>
                        <div th:if="${#fields.hasErrors('quantity')}" class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span th:errors="*{quantity}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="description"><i class="fas fa-align-left"></i>Description</label>
                        <textarea class="form-control" id="description" th:field="*{description}" placeholder="Describe the item in detail (10-2000 characters)..." required></textarea>
                        <div th:if="${#fields.hasErrors('description')}" class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span th:errors="*{description}"></span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label"><i class="fas fa-image"></i>Item Image</label>
                        <div class="file-upload-area" id="fileUploadArea">
                            <div class="file-upload-icon"><i class="fas fa-cloud-upload-alt"></i></div>
                            <div class="file-upload-text" id="fileUploadText">Drop a new image to replace</div>
                            <div class="file-upload-hint">Leave empty to keep the current image &bull; PNG, JPG up to 10MB</div>
                            <input type="file" class="file-input" id="imageFile" th:field="*{imageFile}" accept="image/*">
                        </div>
                        <div th:if="${#fields.hasErrors('imageFile')}" class="error-message">
                            <i class="fas fa-exclamation-triangle"></i>
                            <span th:errors="*{imageFile}"></span>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i>
                            Save Changes
                        </button>
                        <a th:href="@{/items/my}" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i>
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script>
        const fileUploadArea = document.getElementById('fileUploadArea');
        const fileInput = document.getElementById('imageFile');
        const fileUploadText = document.getElementById('fileUploadText');

        fileUploadArea.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (file) {
                fileUploadText.textContent = file.name;
            }
        });
    </script>
</body>
</html>
