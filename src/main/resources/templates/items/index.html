<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inventory - Danial Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
      :root {
        --primary-color: #6366f1;
        --primary-dark: #4f46e5;
        --secondary-color: #f59e0b;
        --success-color: #10b981;
        --dark-color: #1f2937;
        --light-color: #f8fafc;
        --border-color: #e2e8f0;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 100vh;
      }

      .header-section {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        padding: 3rem 0;
        margin-bottom: 2rem;
      }

      .page-title {
        color: white;
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
      }

      .page-subtitle {
        color: rgba(255,255,255,0.9);
        font-size: 1.1rem;
      }

      .nav-bar {
        background: white;
        border-radius: 16px;
        padding: 1rem 1.5rem;
        margin-bottom: 2rem;
        box-shadow: var(--shadow-md);
        border: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .nav-links a {
        color: var(--primary-color);
        text-decoration: none;
        font-weight: 600;
        margin-right: 1.5rem;
      }

      .nav-links a:hover {
        text-decoration: underline;
      }

      .items-count {
        background: rgba(99, 102, 241, 0.1);
        color: var(--primary-color);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.875rem;
        font-weight: 500;
      }

      .items-container {
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: var(--shadow-lg);
        border: 1px solid var(--border-color);
      }

      .table-header {
        background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
        padding: 1.5rem 2rem;
      }

      .table-title {
        color: white;
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0;
      }

      .modern-table {
        margin: 0;
        width: 100%;
      }

      .modern-table thead th {
        background: var(--light-color);
        color: var(--text-primary);
        font-weight: 600;
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 1rem 1.5rem;
        border-bottom: 2px solid var(--border-color);
        border-top: none;
      }

      .modern-table tbody td {
        padding: 1.25rem 1.5rem;
        vertical-align: middle;
        border-color: var(--border-color);
      }

      .item-name {
        font-weight: 600;
        color: var(--text-primary);
      }

      .item-brand {
        color: var(--primary-color);
        font-weight: 500;
      }

      .item-category {
        background: linear-gradient(135deg, var(--secondary-color) 0%, #d97706 100%);
        color: white;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8rem;
        font-weight: 500;
        display: inline-block;
        text-transform: capitalize;
      }

      .item-quantity {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--success-color);
      }

      .item-image {
        border-radius: 12px;
        object-fit: cover;
        border: 2px solid var(--border-color);
      }

      .item-date {
        color: var(--text-secondary);
        font-size: 0.875rem;
      }

      .empty-state {
        text-align: center;
        padding: 4rem 2rem;
        color: var(--text-secondary);
      }

      .empty-state i {
        font-size: 4rem;
        color: var(--border-color);
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="header-section">
      <div class="container text-center">
        <h1 class="page-title"><i class="fas fa-boxes me-3"></i>Inventory</h1>
        <p class="page-subtitle">Browse all approved items in the shared inventory</p>
      </div>
    </div>

    <div class="container">
      <div class="nav-bar">
        <div class="nav-links">
          <a th:href="@{/items}"><i class="fas fa-home me-1"></i>Inventory</a>
          <a th:href="@{/items/my}"><i class="fas fa-user me-1"></i>My Items</a>
          <a th:if="${isAdmin}" th:href="@{/admin/items}"><i class="fas fa-user-shield me-1"></i>Admin</a>
          <a th:href="@{/account}"><i class="fas fa-id-badge me-1"></i>Account</a>
        </div>
        <div class="items-count">
          <i class="fas fa-cube me-1"></i>
          <span th:text="${#lists.size(items)} + ' Items'">0 Items</span>
        </div>
      </div>

      <div class="items-container">
        <div class="table-header">
          <h2 class="table-title"><i class="fas fa-warehouse me-2"></i>Available Items</h2>
        </div>

        <div class="table-responsive">
          <table class="modern-table table">
            <thead>
              <tr>
                <th>Item</th>
                <th>Brand</th>
                <th>Category</th>
                <th>Quantity</th>
                <th>Image</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="item : ${items}">
                <td><div class="item-name" th:text="${item.name}">Sample Item</div></td>
                <td><div class="item-brand" th:text="${item.brand}">Brand Name</div></td>
                <td><span class="item-category" th:text="${item.category}">Category</span></td>
                <td><div class="item-quantity" th:text="${item.quantity}">0</div></td>
                <td>
                  <img th:if="${item.imageFileName}" th:src="@{'/images/' + ${item.imageFileName}}"
                       alt="Item Image" class="item-image" width="80" height="80">
                </td>
                <td><div class="item-date" th:text="${#dates.format(item.createdAt, 'MMM dd, yyyy')}">Jan 15, 2024</div></td>
              </tr>

              <tr th:if="${#lists.isEmpty(items)}">
                <td colspan="6">
                  <div class="empty-state">
                    <i class="fas fa-box-open"></i>
                    <h3>No Items Available</h3>
                    <p>There are no approved items in the inventory yet.</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
