<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a0b2e 50%, #16213e 100%);
            min-height: 100vh;
            color: #e0e7ff;
        }
        .card-glass {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
        }
        .form-label { color: #94a3b8; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-control, .form-control:focus {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(129,140,248,0.3);
            color: #e0e7ff;
            border-radius: 10px;
        }
        .form-control:focus { border-color: rgba(129,140,248,0.6); box-shadow: 0 0 0 3px rgba(99,102,241,0.15); }
        .form-control::placeholder { color: #475569; }
        .error-message { color: #f87171; font-size: 0.82rem; margin-top: 4px; }
        .profile-avatar {
            width: 90px; height: 90px;
            border-radius: 50%; object-fit: cover;
            border: 3px solid rgba(129,140,248,0.5);
        }
        .avatar-placeholder {
            width: 90px; height: 90px;
            border-radius: 50%;
            background: rgba(99,102,241,0.2);
            border: 3px solid rgba(129,140,248,0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 2.2rem; color: #818cf8;
        }
        .btn-submit {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none; color: white; border-radius: 10px;
            padding: 12px 28px; font-weight: 600; transition: all 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); color: white; }
        .btn-cancel {
            background: rgba(255,255,255,0.07);
            border: 1px solid rgba(255,255,255,0.15);
            color: #94a3b8; border-radius: 10px;
            padding: 12px 28px; font-weight: 600; text-decoration: none;
            display: inline-block; transition: all 0.2s;
        }
        .btn-cancel:hover { background: rgba(255,255,255,0.12); color: #e0e7ff; }
    </style>
</head>
<body>
<div class="container py-5" style="max-width:600px; position:relative; z-index:1;">

    <h1 class="mb-4 text-center fw-bold" style="background:linear-gradient(135deg,#818cf8,#c084fc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
        Edit Profile
    </h1>

    <div class="card-glass p-4">
        <!-- Current avatar preview -->
        <div class="text-center mb-4">
            <img th:if="${user.profilePicture}"
                 th:src="@{'/images/profiles/' + ${user.profilePicture}}"
                 alt="Profile" class="profile-avatar">
            <div th:unless="${user.profilePicture}" class="avatar-placeholder mx-auto">
                <i class="fas fa-user"></i>
            </div>
        </div>

        <form th:action="@{/account/edit}" method="post" th:object="${profileDTO}" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

            <div class="mb-3">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" th:field="*{fullName}"
                       th:class="${#fields.hasErrors('fullName')} ? 'form-control is-invalid' : 'form-control'"
                       placeholder="e.g. Ahmad bin Abdullah">
                <div th:if="${#fields.hasErrors('fullName')}" class="error-message" th:errors="*{fullName}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">IC Number</label>
                <input type="text" class="form-control" th:field="*{icNumber}"
                       th:class="${#fields.hasErrors('icNumber')} ? 'form-control is-invalid' : 'form-control'"
                       placeholder="e.g. 900101-14-1234">
                <div th:if="${#fields.hasErrors('icNumber')}" class="error-message" th:errors="*{icNumber}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone Number</label>
                <input type="text" class="form-control" th:field="*{phoneNumber}"
                       th:class="${#fields.hasErrors('phoneNumber')} ? 'form-control is-invalid' : 'form-control'"
                       placeholder="e.g. 011-12345678">
                <div th:if="${#fields.hasErrors('phoneNumber')}" class="error-message" th:errors="*{phoneNumber}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea class="form-control" th:field="*{address}" rows="3"
                          placeholder="Street, City, Postcode, State"></textarea>
            </div>

            <div class="mb-4">
                <label class="form-label">Profile Picture</label>
                <input type="file" class="form-control" th:field="*{profileImageFile}" accept="image/*">
                <div class="mt-1" style="color:#475569;font-size:0.8rem;">PNG, JPG up to 10MB. Leave empty to keep current picture.</div>
            </div>

            <div class="d-flex gap-3">
                <button type="submit" class="btn-submit">
                    <i class="fas fa-save me-2"></i>Save Changes
                </button>
                <a th:href="@{/account}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
